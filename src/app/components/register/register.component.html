<h2>Registro de Cliente</h2>
<form [formGroup]="formCliente" (ngSubmit)="registrarCliente()">
  <!-- Email -->
  <div>
    <input formControlName="email" placeholder="Email" type="email">
    <div *ngIf="submitted() && formCliente.get('email')?.invalid" class="error">
      Campo incompleto o email inválido
    </div>
  </div>

  <!-- Password -->
  <div>
    <input formControlName="password" placeholder="Contraseña" type="password">
    <div *ngIf="submitted() && formCliente.get('password')?.invalid" class="error">
      Campo incompleto (mínimo 6 caracteres)
    </div>
  </div>

  <!-- Nombre -->
  <div>
    <input formControlName="nombre" placeholder="Nombre">
    <div *ngIf="submitted() && formCliente.get('nombre')?.invalid" class="error">
      Campo incompleto (mínimo 3 letras)
    </div>
  </div>

  <!-- Apellido -->
  <div>
    <input formControlName="apellido" placeholder="Apellido">
    <div *ngIf="submitted() && formCliente.get('apellido')?.invalid" class="error">
      Campo incompleto
    </div>
  </div>

  <!-- Fecha de nacimiento -->
  <div>
    <input 
      formControlName="fechaNacimiento" 
      type="text" 
      placeholder="Fecha de nacimiento" 
      onfocus="(this.type='date')" 
      onblur="(this.value ? this.type='date' : this.type='text')">
      
    <div *ngIf="submitted() && formCliente.get('fechaNacimiento')?.invalid" class="error">
      <span *ngIf="formCliente.get('fechaNacimiento')?.hasError('required')">Campo incompleto</span>
      <span *ngIf="formCliente.get('fechaNacimiento')?.hasError('menorDeEdad')">Debes tener al menos 13 años para registrarte</span>
    </div>
  </div>

  <!-- Tipo de sangre -->
  <div>
    <input formControlName="tipoSangre" placeholder="Tipo de sangre">
    <div *ngIf="submitted() && formCliente.get('tipoSangre')?.invalid" class="error">
      Campo incompleto
    </div>
  </div>

  <!-- Color de ojos -->
  <div>
    <input formControlName="colorOjos" placeholder="Color de ojos">
    <div *ngIf="submitted() && formCliente.get('colorOjos')?.invalid" class="error">
      Campo incompleto
    </div>
  </div>

  <!-- Vacaciones -->
  <div>
    <input formControlName="vacaciones" type="number" placeholder="Días de vacaciones">
    <div *ngIf="submitted() && formCliente.get('vacaciones')?.invalid" class="error">
      Campo incompleto o número inválido
    </div>
  </div>

  <button type="submit">Registrarse</button>
  <button type="button" (click)="volverAlLogin()">Atrás</button>
</form>
