<div class="register-container">
  <h2>Registro de Cliente</h2>

  <form (ngSubmit)="registrarCliente()">
    <div class="form-group">
      <label for="email">Correo:</label>
      <input id="email" [(ngModel)]="cliente.email" name="email" type="email" required />
    </div>

    <div class="form-group">
      <label for="password">Contraseña:</label>
      <input id="password" [(ngModel)]="cliente.password" name="password" type="password" required />
    </div>

    <div class="form-group">
      <label for="nombre">Nombre:</label>
      <input id="nombre" [(ngModel)]="cliente.nombre" name="nombre" required />
    </div>

    <div class="form-group">
      <label for="apellido">Apellido:</label>
      <input id="apellido" [(ngModel)]="cliente.apellido" name="apellido" required />
    </div>

    <div class="form-group">
      <label for="fechaNacimiento">Fecha de nacimiento:</label>
      <input id="fechaNacimiento" [(ngModel)]="cliente.fechaNacimiento" name="fechaNacimiento" type="date" required />
    </div>

    <div class="form-group">
      <label for="tipoSangre">Tipo de sangre:</label>
      <input id="tipoSangre" [(ngModel)]="cliente.tipoSangre" name="tipoSangre" required />
    </div>

    <div class="form-group">
      <label for="colorOjos">Color de ojos:</label>
      <input id="colorOjos" [(ngModel)]="cliente.colorOjos" name="colorOjos" required />
    </div>

    <div class="form-group">
      <label for="vacaciones">Días de vacaciones por año:</label>
      <input id="vacaciones" [(ngModel)]="cliente.vacaciones" name="vacaciones" type="number" required />
    </div>

    <button type="submit">Registrarse</button>
    <button type="button" (click)="volverAlLogin()">Volver al Login</button>
  </form>
</div>
