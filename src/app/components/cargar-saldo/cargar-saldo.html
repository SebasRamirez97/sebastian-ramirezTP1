<div class="carga-container">
  <h2>💳 Recargar Saldo (Dinero)</h2>
  <p class="subtitulo">Selecciona o ingresa el monto que deseas cargar a tu cuenta de cine.</p>

  <div class="form-grupo">
    <label for="monto">Monto a cargar ($):</label>
    <input 
      type="number" 
      id="monto" 
      [value]="montoACargar()" 
      (input)="actualizarMonto($event)"
      min="100" 
      step="100" 
      class="input-monto"
    />
  </div>

  <!-- Botones de montos rápidos -->
  <div class="montos-rapidos">
    <button (click)="setMontoRapido(1000)">+$1,000</button>
    <button (click)="setMontoRapido(5000)">+$5,000</button>
    <button (click)="setMontoRapido(10000)">+$10,000</button>
  </div>

  <div class="acciones">
    <button class="btn btn-secundario" (click)="volver()">Cancelar</button>
    <button class="btn btn-primary" (click)="procesarCarga()" [disabled]="cargando()">
      <span *ngIf="cargando(); else textoNormal">Procesando...</span>
      <ng-template #textoNormal>Confirmar Recarga 🚀</ng-template>
    </button>
  </div>
</div>
