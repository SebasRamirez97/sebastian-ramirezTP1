<div class="carga-container">
  <h2>💳 Recargar Saldo (Dinero)</h2>
  <p class="subtitulo">Selecciona o ingresa el monto que deseas cargar a tu cuenta de cine.</p>

  <div class="form-grupo">
    <label for="monto">Monto a cargar ($):</label>
    <input 
      type="number" 
      id="monto" 
      [(ngModel)]="montoACargar" 
      min="100" 
      step="100" 
      class="input-monto"
    />
  </div>

  <!-- Botones de montos rápidos opcionales -->
  <div class="montos-rapidos">
    <button (click)="montoACargar = 1000">+$1,000</button>
    <button (click)="montoACargar = 5000">+$5,000</button>
    <button (click)="montoACargar = 10000">+$10,000</button>
  </div>

  <div class="acciones">
    <button class="btn btn-secundario" (click)="volver()">Cancelar</button>
    <button class="btn btn-primary" (click)="procesarCarga()" [disabled]="cargando">
      {{ cargando ? 'Procesando...' : 'Confirmar Recarga 🚀' }}
    </button>
  </div>
</div>
