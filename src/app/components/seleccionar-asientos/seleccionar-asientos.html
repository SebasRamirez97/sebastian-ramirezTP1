<div class="asientos-container">
  <!-- Cabecera con título y botón de regreso -->
  <div class="header-asientos">
    <button class="btn btn-secundario" (click)="volverAFunciones()">⬅ Volver a Funciones</button>
    <h2>🎟️ Selecciona tus Asientos</h2>
  </div>

  <!-- Estado de carga con *ngIf / *ngElse -->
  <div *ngIf="cargando(); else contenidoSala">
    <p class="loading">Cargando mapa de la sala...</p>
  </div>

  <ng-template #contenidoSala>
    <!-- Selector de Cantidad de Entradas -->
    <div class="selector-cantidad-container">
      <label>¿Cuántas entradas deseas comprar?</label>
      <div class="controles-cantidad">
        <button
          class="btn-cantidad"
          (click)="cambiarCantidad(-1)"
          [disabled]="cantidadPermitida() <= 1"
        >
          ➖
        </button>
        <span class="numero-cantidad">{{ cantidadPermitida() }}</span>
        <button class="btn-cantidad" (click)="cambiarCantidad(1)">➕</button>
      </div>
    </div>

    <!-- Pantalla del Cine -->
    <div class="pantalla-cine">PANTALLA</div>

    <!-- Cuadrícula de Asientos con Distribución de Pasillos y Bloques -->
    <div class="sala-grid">
      <div
        *ngFor="let fila of filas(); trackBy: trackByFila"
        class="fila-container"
        [ngClass]="{
          'fila-discapacitados': fila === 'J-K',
          'fila-vip': fila === 'R' || fila === 'S' || fila === 'T',
        }"
      >
        <span class="letra-fila">{{ fila }}</span>

        <!-- Contenedor de los 3 bloques de la fila -->
        <div class="bloques-asientos">
          <!-- Bloque Izquierdo -->
          <div class="bloque columna-izquierda">
            <button
              *ngFor="let num of obtenerBloquesFila(fila).izquierda; trackBy: trackByNum"
              class="btn-asiento"
              [ngClass]="obtenerObjetoClases(fila, num)"
              [disabled]="isAsientoDeshabilitado(fila, num)"
              (click)="seleccionarAsiento(fila, num)"
              title="Fila {{ fila }} Asiento {{ num }}"
            >
              {{ num }}
            </button>
          </div>

          <div class="pasillo"></div>

          <!-- Bloque Central -->
          <div class="bloque columna-centro">
            <button
              *ngFor="let num of obtenerBloquesFila(fila).centro; trackBy: trackByNum"
              class="btn-asiento"
              [ngClass]="obtenerObjetoClases(fila, num)"
              [disabled]="isAsientoDeshabilitado(fila, num)"
              (click)="seleccionarAsiento(fila, num)"
              title="Fila {{ fila }} Asiento {{ num }}"
            >
              {{ num }}
            </button>
          </div>

          <div class="pasillo"></div>

          <!-- Bloque Derecho -->
          <div class="bloque columna-derecha">
            <button
              *ngFor="let num of obtenerBloquesFila(fila).derecha; trackBy: trackByNum"
              class="btn-asiento"
              [ngClass]="obtenerObjetoClases(fila, num)"
              [disabled]="isAsientoDeshabilitado(fila, num)"
              (click)="seleccionarAsiento(fila, num)"
              title="Fila {{ fila }} Asiento {{ num }}"
            >
              {{ num }}
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Leyenda de Colores -->
    <div class="leyenda">
      <div class="item-leyenda"><span class="cuadrito-asiento-libre"></span> Libre</div>
      <div class="item-leyenda"><span class="cuadrito-asiento-mio"></span> Seleccion</div>
      <div class="item-leyenda"><span class="cuadrito-asiento-mio-comprado"></span> Mis Asientos</div>
      <div class="item-leyenda"><span class="cuadrito-asiento-ocupado"></span> Ocupado</div>
    </div>

    <!-- Resumen y Botón de Pago / Candy Bar -->
    <div class="resumen-compra">
      <h3>Asientos elegidos: {{ misAsientosSeleccionados().length }}</h3>

      <div *ngIf="misAsientosSeleccionados().length > 0">
        <div class="lista-seleccionados-grupo">
          <!-- Mostramos las coordenadas de todos los asientos juntos con let isLast = last corregido -->
          <p class="coordenadas-texto">
            <strong>Butacas:</strong>
            <span *ngFor="let asiento of misAsientosSeleccionados(); trackBy: trackByAsiento; let isLast = last">
              {{ asiento.fila }}-{{ asiento.numero_asiento }}{{ !isLast ? ', ' : '' }}
            </span>
          </p>
        </div>

        <div class="botones-acciones-compra" style="display: flex; gap: 10px; justify-content: center; margin-top: 15px;">
          <!-- Botón para ir al Candy Bar -->
          <button class="btn btn-secundario" (click)="irAlCandyBar()">
            🍿 Agregar Snacks (Candy Bar)
          </button>

          <!-- Botón de pago directo habitual -->
          <button class="btn btn-primary btn-pagar" (click)="procederAlPago()">
            Ir a Pagar / Resumen 🛒
          </button>
        </div>
      </div>
    </div>
  </ng-template>
</div>
