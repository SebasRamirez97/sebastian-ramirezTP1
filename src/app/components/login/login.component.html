<div class="login-container">
  <h2>Iniciar Sesión</h2>

  <form (ngSubmit)="login()">
    <div class="form-group">
      <label for="email">Correo:</label>
      <input id="email" [(ngModel)]="email" name="email" type="email" required />
    </div>

    <div class="form-group">
      <label for="password">Contraseña:</label>
      <input id="password" [(ngModel)]="password" name="password" type="password" required />
    </div>

    <button type="submit">Ingresar</button>
  </form>

  <hr />

  <!-- Cliente anónimo -->
  <div class="anonimo-container">
    <input [(ngModel)]="nombreAnonimo" name="nombreAnonimo" placeholder="Tu nombre" required />
    <button class="anonimo-btn" (click)="loginAnonimo()">Ingresar como Anónimo</button>
  </div>

  <button type="button" (click)="irARegistro()" class="registro-btn">Registrarse</button>
</div>
