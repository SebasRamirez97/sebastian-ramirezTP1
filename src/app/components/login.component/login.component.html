<h2>Login</h2>
<form (ngSubmit)="login()">
  <input [(ngModel)]="email" name="email" placeholder="Email">
  <input [(ngModel)]="password" name="password" type="password" placeholder="Contraseña">
  <button type="submit">Ingresar</button>
</form>

<h2>Ingresar como anónimo</h2>
<form (ngSubmit)="loginAnonimo()">
  <input [(ngModel)]="nombreAnonimo" name="nombreAnonimo" placeholder="Tu nombre">
  <button type="submit">Entrar sin registro</button>
</form>

<!-- Botón para ir al registro -->
<button routerLink="/registro">Registrarse</button>
