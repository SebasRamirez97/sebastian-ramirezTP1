<div class="admin-container">
  <h2>Crear Nueva Función de Cine</h2>

  <!-- Alertas de Feedback usando *ngIf -->
  <div *ngIf="mensajeExito()" class="alert alert-success">
    {{ mensajeExito() }}
  </div>

  <div *ngIf="mensajeError()" class="alert alert-danger">
    {{ mensajeError() }}
  </div>

  <form [formGroup]="funcionForm" (ngSubmit)="onSubmit()" class="form-funcion">
    
    <!-- Selección de Película -->
    <div class="form-group">
      <label for="pelicula_id">Película:</label>
      <select id="pelicula_id" formControlName="pelicula_id" class="form-control">
        <option value="" disabled>Seleccione una película...</option>
        <option *ngFor="let pelicula of peliculas(); trackBy: trackByPelicula" [value]="pelicula.id">
          {{ pelicula.nombre }} ({{ pelicula.duracion }} min)
        </option>
      </select>
      
      <span *ngIf="funcionForm.get('pelicula_id')?.touched && funcionForm.get('pelicula_id')?.invalid" class="error-text">
        Debe seleccionar una película.
      </span>
    </div>

    <!-- Selección de Formato -->
    <div class="form-group">
      <label for="formato">Formato:</label>
      <select id="formato" formControlName="formato" class="form-control">
        <option *ngFor="let fmt of formatos(); trackBy: trackByFormato" [value]="fmt">{{ fmt }}</option>
      </select>
    </div>

    <!-- 🌟 Selección de Idioma (Castellano / Subtitulada) -->
    <div class="form-group">
      <label for="idioma">Idioma / Versión:</label>
      <select id="idioma" formControlName="idioma" class="form-control">
        <option *ngFor="let lang of idiomas(); trackBy: trackByIdioma" [value]="lang">{{ lang }}</option>
      </select>
    </div>

    <!-- 🌟 Componente Selector de Fecha Personalizado -->
    <div class="form-group">
      <label>Fecha de la Función:</label>
      <app-selector-fecha (fechaSeleccionada)="onFechaCambiada($event)"></app-selector-fecha>
    </div>

    <!-- Hora de Inicio -->
    <div class="form-group">
      <label for="hora_inicio">Hora de Inicio:</label>
      <input 
        type="time" 
        id="hora_inicio" 
        formControlName="hora_inicio" 
        class="form-control"
      />
      <span *ngIf="funcionForm.get('hora_inicio')?.touched && funcionForm.get('hora_inicio')?.invalid" class="error-text">
        La hora de inicio es requerida.
      </span>
    </div>

    <!-- Precio en Pesos -->
    <div class="form-group">
      <label for="precio_pesos">Precio Base (Pesos $):</label>
      <input 
        type="number" 
        id="precio_pesos" 
        formControlName="precio_pesos" 
        class="form-control" 
        min="0"
      />
    </div>

    <!-- Precio en Puntos -->
    <div class="form-group">
      <label for="precio_puntos">Precio Base (Puntos Canjeables):</label>
      <input 
        type="number" 
        id="precio_puntos" 
        formControlName="precio_puntos" 
        class="form-control" 
        min="0"
      />
    </div>

    <!-- Botones de Acción -->
    <div class="form-actions">
      <button type="submit" [disabled]="funcionForm.invalid || cargando()" class="btn-submit">
        <span *ngIf="!cargando(); else textoCargando">Programar Función</span>
        <ng-template #textoCargando>Verificando disponibilidad de sala...</ng-template>
      </button>

      <button type="button" class="btn-cancel" (click)="onCancelar()">
        Cancelar
      </button>
    </div>

  </form>
</div>
